services:
  documind:
    build: .
    ports:
      - "8092:8092"
    environment:
      DOCUMIND_HOST: "0.0.0.0"
      DOCUMIND_PORT: "8092"
      DOCUMIND_DATA_DIR: "/data"
      DOCUMIND_OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - documind_data:/data
    restart: unless-stopped

volumes:
  documind_data:
